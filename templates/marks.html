<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Entry</title>

```
<!-- ✅ Flask CSS -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">

<!-- Icons (Cloudflare CDN) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
```

</head>

<body>
<div class="app-container">

```
<!-- HEADER -->
<header class="main-header">
    <div class="logo">Marks <span>Entry</span></div>
    <a href="/logout">
        <button class="logout-btn">Logout <i class="fas fa-sign-out-alt"></i></button>
    </a>
</header>

<!-- MAIN CONTENT -->
<main class="content-wrapper">

<form method="GET" action="/marks" style="margin-bottom:20px;">

    <!-- COURSE -->
    <select name="course">
        <option value="">All Courses</option>
        {% for c in courses %}
        <option value="{{ c }}" {% if request.args.get('course') == c %}selected{% endif %}>
            {{ c }}
        </option>
        {% endfor %}
    </select>

    <!-- SUBJECT -->
    <select name="subject">
        <option value="">All Subjects</option>
        {% for s in subjects %}
        <option value="{{ s }}" {% if request.args.get('subject') == s %}selected{% endif %}>
            {{ s }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Apply Filter</button>

</form>

    <!-- ✅ ADD MARKS FORM -->
    <div style="margin-bottom:20px;">
       <form method="POST" action="/add-marks">

       <input type="text" name="student_name" placeholder="Student Name" required>

<input type="text" name="course" placeholder="Course (e.g. BCA)" required>

<select name="student_id">
    {% for s in students %}
    <option value="{{ s[0] }}">{{ s[1] }} ({{ s[0] }})</option>
    {% endfor %}
</select>

<!-- ✅ ADD THIS -->
<input type="text" name="subject_name" placeholder="Subject (e.g. DBMS)" required>

<input type="number" name="marks" placeholder="Marks" required>

<button type="submit">Add Marks</button>
    </div>
</form>

    <!-- TABLE -->
    <div class="table-card">

        <div class="table-header">
            <h2>Enter Marks</h2>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search name or roll no...">
            </div>
        </div>

        <div class="table-responsive">
            <table id="marksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Student Name</th>
                        <th>Course</th>
                        <th>Subject</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for row in data %}
                    <tr>
    <td>{{ row[0] }}</td>
    <td><b>{{ row[1] }}</b></td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>

    <!-- EDIT FORM -->
    <td>
        <form method="POST" action="/update-marks">
            <input type="hidden" name="id" value="{{ row[0] }}">
            <input type="number" name="marks" value="{{ row[4] }}" class="marks-input">
            <button type="submit" class="edit-btn">Update</button>
        </form>
    </td>

    <!-- DELETE BUTTON -->
    <td>
        <form method="POST" action="/delete-marks">
            <input type="hidden" name="id" value="{{ row[0] }}">
            <button type="submit" class="delete-btn">Delete</button>
        </form>
    </td>
</tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>
    </div>

</main>
```

</div>

</body>
</html>
